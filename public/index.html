<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Clip</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="bar">
    <a class="logo" href="/">Clip</a>
    <button id="tag-chip" class="chip" hidden></button>
    <button id="order" class="icon" aria-label="並び順"></button>
    <button id="grid-toggle" class="icon" aria-label="一覧"></button>
    <button id="mute" class="icon" aria-label="音声のオン/オフ"></button>
  </header>

  <main id="feed" class="feed" aria-live="polite"></main>
  <div id="grid" class="grid" hidden></div>

  <p id="empty" class="empty" hidden>まだ切り抜きがありません</p>

  <template id="slide-template">
    <section class="slide">
      <video playsinline loop preload="none"></video>
      <div class="paused" aria-hidden="true">▶</div>
      <div class="meta">
        <h2 class="title"></h2>
        <p class="desc"></p>
        <div class="tags"></div>
        <a class="source" target="_blank" rel="noopener"></a>
      </div>
      <div class="actions">
        <button class="icon delete" aria-label="削除">🗑</button>
      </div>
      <div class="progress"><div></div></div>
    </section>
  </template>

  <script src="/app.js" type="module"></script>
</body>
</html>
